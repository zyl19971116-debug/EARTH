name: Deferred buyback keeper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: deferred-buyback-keeper
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retry pending buyback
        env:
          KEEPER_ENDPOINT: https://www.earthonline.today/api/cron/buyback
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl --fail --silent --show-error --retry 2 \
              -H "Authorization: Bearer $CRON_SECRET" "$KEEPER_ENDPOINT"
          else
            curl --fail --silent --show-error --retry 2 "$KEEPER_ENDPOINT"
          fi
